[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vinemis-vineyard-decision-support"
version = "0.1.0"
description = "VineMIS demo: synthetic geotagged plant-passport registry with deterministic WGS84 coordinates, JSON/SQLite storage, GeoJSON/KML exports, and a decision-support summary."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jayant Jaishwin Shanmugam Kavitha" }]
keywords = ["vineyard", "RFID", "GPS", "GIS", "traceability", "decision support", "synthetic data"]
dependencies = []

[project.scripts]
vinemis = "vinemis.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
